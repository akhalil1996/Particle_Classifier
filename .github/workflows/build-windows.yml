# Builds the Windows installer on GitHub's Windows machines.
# - Every push to main and every pull request: build and keep the installer as a workflow artifact.
# - A tag like v0.1.0: also publish a GitHub Release with CauliQuant-Setup-0.1.0.exe attached.
name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(python -c 'import cauliquant; print(cauliquant.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Self-test (analysis + report on the bundled test image)
        run: python tests/smoke_test.py

      - name: Build app folder (PyInstaller)
        run: pyinstaller packaging/cauliquant.spec --noconfirm

      - name: Check the built app starts and analyses an image
        shell: cmd
        run: |
          start "" /wait dist\CauliQuant\CauliQuant.exe --self-test
          set rc=%errorlevel%
          type "%TEMP%\cauliquant_selftest.log"
          exit /b %rc%

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" packaging\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: CauliQuant-Setup-${{ steps.ver.outputs.version }}
          path: installer/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
          generate_release_notes: true
